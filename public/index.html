<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shop Túi Mù Siêu Cấp</title>
    <style>
        :root { --pt-pink: #ff6b81; --pt-yellow: #feca57; --pt-purple: #5f27cd; --pt-blue: #00d2d3; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f7f9fc; color: #333; padding-bottom: 50px; }
        .mobile-header { background: linear-gradient(135deg, var(--pt-pink), var(--pt-purple)); color: white; padding: 15px; text-align: center; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 99; }
        .shop-name { font-size: 22px; font-weight: 900; color: var(--pt-yellow); text-shadow: 2px 2px var(--pt-purple); }
        .user-panel { max-width: 500px; margin: 15px auto; background: white; border-radius: 15px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); width: 92%; }
        .login-box { text-align: center; width: 100%; }
        .login-box p { font-size: 14px; font-weight: bold; margin-bottom: 10px; color: var(--pt-purple); }
        .login-input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 25px; margin-bottom: 10px; font-size: 15px; text-align: center; outline: none; }
        .login-btn { background: linear-gradient(to right, var(--pt-pink), var(--pt-purple)); color: white; border: none; padding: 12px; border-radius: 25px; width: 100%; font-weight: bold; cursor: pointer; font-size: 15px; }
        .profile { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .profile-info { display: flex; align-items: center; gap: 10px; }
        .profile-info img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--pt-pink); }
        .uid-tag { background: #eee; font-size: 12px; padding: 2px 6px; border-radius: 5px; font-weight: bold; display: inline-block; margin-top: 3px; }
        .money { color: #2ed573; font-weight: bold; font-size: 16px; text-align: right; }
        .btn-add-money { background: var(--pt-yellow); color: #000; border: none; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; margin-top: 4px; cursor: pointer; }
        .banner { max-width: 500px; width: 92%; margin: 10px auto; background: linear-gradient(45deg, #ff9f43, var(--pt-pink)); border-radius: 15px; padding: 20px; color: white; text-align: center; font-weight: bold; }
        .shop-container { max-width: 500px; width: 92%; margin: 20px auto; }
        .section-title { font-size: 18px; font-weight: 800; margin-bottom: 12px; color: var(--pt-purple); }
        .bag-card { background: white; border-radius: 20px; border: 3px solid var(--pt-pink); overflow: hidden; margin-bottom: 20px; text-align: center; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .bag-card.blue-theme { border-color: var(--pt-blue); }
        .bag-img { font-size: 70px; margin: 15px 0; display: inline-block; }
        .bag-title { font-size: 18px; font-weight: bold; }
        .bag-price { font-size: 20px; font-weight: 900; color: var(--pt-pink); margin: 5px 0 15px 0; }
        .bag-card.blue-theme .bag-price { color: var(--pt-blue); }
        .btn-open { background: linear-gradient(to right, var(--pt-pink), #ff4757); color: white; border: none; width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 15px; cursor: pointer; }
        .btn-open.blue-btn { background: linear-gradient(to right, var(--pt-blue), var(--pt-purple)); }
        .shake { animation: shakeMobile 0.5s infinite; }
        @keyframes shakeMobile { 0% { transform: rotate(0deg); } 25% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } 75% { transform: rotate(-1deg); } 100% { transform: rotate(0deg); } }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: white; border-radius: 20px; padding: 25px; width: 100%; max-width: 400px; text-align: center; }
        .acc-info-box { background: #f1f2f6; border: 2px dashed var(--pt-purple); padding: 15px; border-radius: 12px; margin: 15px 0; text-align: left; }
        .btn-close { background: #2f3542; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; width: 100%; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="mobile-header"><div class="shop-name">🛍️ PTG-BAG.SHOP 🛍️</div></div>
    
    <div class="user-panel" id="auth-panel">
        <div class="login-box">
            <p>📧 VUI LÒNG NHẬP GMAIL ĐỂ ĐĂNG NHẬP / ĐĂNG KÝ</p>
            <input type="email" id="gmail-input" class="login-input" placeholder="Ví dụ: nguyenvana@gmail.com">
            <button class="login-btn" onclick="handleGmailLogin()">TIẾP TỤC VÀO SHOP</button>
        </div>
    </div>

    <div class="banner">🎉 SIÊU THỊ TÚI MÙ ACC GAME ĐA DẠNG GIÁ RẺ 🎉</div>
    
    <div class="shop-container">
        <div class="section-title">📦 DANH SÁCH TÚI MÙ ĐANG CÓ</div>
        
        <!-- Ô TÚI MÙ 1: PLAY TOGETHER -->
        <div class="bag-card">
            <div class="bag-title">Túi Mù Play Together Siêu VIP</div>
            <div class="bag-img" id="bag-playtogether">🛍️</div>
            <div class="bag-price">30,000đ</div>
            <button class="btn-open" onclick="buyBlindBag('playtogether')">XÉ TÚI PLAY TOGETHER</button>
        </div>

        <!-- Ô TÚI MÙ 2: CLONE CƠ KHÍ MỚI THÊM THEO YÊU CẦU -->
        <div class="bag-card blue-theme">
            <div class="bag-title">Túi Mù Acc Clone Cơ Khí VIP</div>
            <div class="bag-img" id="bag-clone_cokhi">⚙️</div>
            <div class="bag-price">20,000đ</div>
            <button class="btn-open blue-btn" onclick="buyBlindBag('clone_cokhi')">XÉ TÚI CLONE CƠ KHÍ</button>
        </div>
    </div>

    <div class="modal" id="popupModal"><div class="modal-content" id="popupContent"></div></div>

    <script>
        let currentUser = null;

        function handleGmailLogin() {
            const email = document.getElementById('gmail-input').value.trim();
            if(!email || !email.includes('@')) return alert("Vui lòng điền đúng địa chỉ Gmail!");

            fetch('/api/auth/gmail-login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email }) })
            .then(res => res.json()).then(data => { if(data.success) { currentUser = data.user; renderUserPanel(); } });
        }

        function renderUserPanel() {
            document.getElementById('auth-panel').innerHTML = `
                <div class="profile">
                    <div class="profile-info">
                        <img src="${currentUser.avatar}">
                        <div>
                            <div style="font-weight: bold; font-size:14px; color:#333; word-break: break-all;">${currentUser.email}</div>
                            <div class="uid-tag">Mã số (UID): ${currentUser.uid}</div>
                        </div>
                    </div>
                    <div>
                        <div class="money">${currentUser.balance.toLocaleString('vi-VN')}đ</div>
                        <button class="btn-add-money" onclick="showNapTienBox()">Nạp tiền</button>
                    </div>
                </div>`;
        }

        function showNapTienBox() {
            document.getElementById('popupContent').innerHTML = `
                <h3>💳 HƯỚNG DẪN NẠP TIỀN QUA ZALO</h3>
                <p style="margin-top:10px;">Mã số của bạn: <strong style="color:var(--pt-purple); font-size:18px;">${currentUser.uid}</strong></p>
                <div style="font-size:22px; font-weight:bold; color:#0084ff; margin:15px 0;">📞 Zalo: 0907859891</div>
                <p style="font-size:13px;">Hãy gửi <b>Mã Số trên + Bill chuyển khoản</b> qua Zalo để Admin cộng số dư nhé!</p>
                <button class="btn-close" onclick="closeModal()">ĐÃ HIỂU</button>`;
            document.getElementById('popupModal').style.display = "flex";
        }

        function buyBlindBag(type) {
            if (!currentUser) return alert("Bạn cần điền GMAIL ở phía trên trước khi xé túi mù!");
            
            const bagImg = document.getElementById(`bag-${type}`);
            bagImg.classList.add('shake');

            setTimeout(() => {
                bagImg.classList.remove('shake');
                fetch('/api/shop/xe-tui', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentUser.email, loaiTui: type }) // Gửi kèm loại túi lên backend
                })
                .then(res => res.json()).then(data => {
                    const content = document.getElementById('popupContent');
                    if (!data.success) {
                        content.innerHTML = `<h3>❌ THẤT BẠI</h3><p>${data.msg}</p><button class="btn-close" onclick="closeModal()">ĐÓNG</button>`;
                    } else {
                        currentUser.balance = data.newBalance; renderUserPanel();
                        content.innerHTML = `
                            <h3>🎉 XÉ TÚI THÀNH CÔNG! 🎉</h3>
                            <div class="acc-info-box">
                                <p>🔐 <b>Tài khoản:</b> ${data.account.tk}</p>
                                <p>🔑 <b>Mật khẩu:</b> ${data.account.mk}</p>
                                <p style="font-size:12px; color:#666; margin-top:5px;">✨ <b>Mô tả:</b> <i>${data.account.note}</i></p>
                            </div>
                            <button class="btn-close" onclick="closeModal()">NHẬN ACC</button>`;
